apiVersion: apps/v1
kind: Deployment
metadata:
  name: viewer
  namespace: livesync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: viewer
  template:
    metadata:
      labels:
        app: viewer
    spec:
      containers:
        - name: viewer
          image: livesync-viewer
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: vault
              mountPath: /vault
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: vault
