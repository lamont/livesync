apiVersion: batch/v1
kind: Job
metadata:
  name: couchdb-init
  namespace: livesync
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-couchdb
          image: curlimages/curl:latest
          command: ["sh", "-c"]
          args:
            - |
              until curl -sf http://couchdb:5984/_up; do
                echo "waiting for couchdb..."
                sleep 3
              done
      containers:
        - name: init
          image: curlimages/curl:latest
          envFrom:
            - configMapRef:
                name: livesync-config
            - secretRef:
                name: livesync-secrets
          command: ["sh", "-c"]
          args:
            - |
              URL="http://${COUCHDB_USER}:${COUCHDB_PASSWORD}@couchdb:5984"
              for db in _users _replicator _global_changes ${COUCHDB_DATABASE}; do
                echo "Creating ${db}..."
                curl -sf -X PUT "${URL}/${db}" || true
              done
              echo "Init complete."
