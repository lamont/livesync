# EFS StorageClass — assumes the EFS CSI driver is installed and an EFS
# filesystem ID is configured.  Replace fs-XXXX with your real ID or use a
# kustomize overlay / patch.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-XXXX          # ← replace with your EFS filesystem ID
  directoryPerms: "700"
