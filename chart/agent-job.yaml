# One-shot agent job — multi-vault mode.
# Override VAULT_NAME and INSTRUCTION when creating a job:
#   kubectl create job agent-run-1 -n livesync --image=livesync-agent \
#     -- env VAULT_NAME=my-wiki INSTRUCTION="summarize this wiki" /entrypoint.sh
apiVersion: batch/v1
kind: Job
metadata:
  name: agent
  namespace: livesync
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: agent
          image: livesync-agent
          env:
            - name: VAULT_NAME
              value: ""
            - name: INSTRUCTION
              value: "Describe the contents of this vault."
          envFrom:
            - configMapRef:
                name: livesync-config
            - secretRef:
                name: livesync-secrets
          volumeMounts:
            - name: agent-data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: agent-data
