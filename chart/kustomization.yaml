apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storageclass.yaml
  - pvc-couchdb.yaml
  - pvc-vaults.yaml
  - pvc-static.yaml
  - pvc-agent.yaml
  - configmap.yaml
  - secret.yaml
  - couchdb-service.yaml
  - couchdb-statefulset.yaml
  - couchdb-init-job.yaml
  - sync-deployment.yaml
  - portal-deployment.yaml
  - portal-service.yaml
  - agent-job.yaml
  - ingress.yaml

# Map logical image names to ECR.  `build-push.sh` publishes as
# eqincubatingimages:{component}-latest in eq-shared-services.
images:
  - name: livesync-sync
    newName: 497689819904.dkr.ecr.us-east-1.amazonaws.com/eqincubatingimages
    newTag: sync-latest
  - name: livesync-portal
    newName: 497689819904.dkr.ecr.us-east-1.amazonaws.com/eqincubatingimages
    newTag: portal-latest
  - name: livesync-agent
    newName: 497689819904.dkr.ecr.us-east-1.amazonaws.com/eqincubatingimages
    newTag: agent-latest
