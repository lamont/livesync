apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storageclass.yaml
  - pvc-couchdb.yaml
  - pvc-vault.yaml
  - configmap.yaml
  - secret.yaml
  - couchdb-service.yaml
  - couchdb-statefulset.yaml
  - couchdb-init-job.yaml
  - sync-deployment.yaml
  - viewer-deployment.yaml
  - viewer-service.yaml
  - agent-job.yaml

# Map logical image names to ECR.  `build-push.sh` publishes as
# eqincubatingimages:{component}-latest in eq-shared-services.
images:
  - name: livesync-sync
    newName: 497689819904.dkr.ecr.us-east-1.amazonaws.com/eqincubatingimages
    newTag: sync-latest
  - name: livesync-viewer
    newName: 497689819904.dkr.ecr.us-east-1.amazonaws.com/eqincubatingimages
    newTag: viewer-latest
  - name: livesync-agent
    newName: 497689819904.dkr.ecr.us-east-1.amazonaws.com/eqincubatingimages
    newTag: agent-latest
