[project]
name = "livesync-portal"
version = "0.1.0"
description = "Self-service vault provisioning portal for Obsidian LiveSync"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "prometheus_client>=0.21",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]
