[project]
name = "livesync-portal"
version = "0.1.0"
description = "Self-service vault provisioning portal for Obsidian LiveSync"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.28",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
]
