services:
  couchdb:
    build:
      context: ./couchdb/docker-obsidian-livesync-couchdb
    ports:
      - "5984:5984"
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsu $$COUCHDB_USER:$$COUCHDB_PASSWORD http://localhost:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  couchdb-init:
    image: curlimages/curl:latest
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidian-wiki}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        URL="http://$$COUCHDB_USER:$$COUCHDB_PASSWORD@couchdb:5984"
        for db in _users _replicator _global_changes $$COUCHDB_DATABASE; do
          echo "Creating $$db..."
          curl -sf -X PUT "$$URL/$$db" || true
        done
        echo "Init complete."
    restart: "no"

  quartz-sync:
    build:
      context: ./quartz-sync
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_URI: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidian-wiki}
      LIVESYNC_PASSPHRASE: ${LIVESYNC_PASSPHRASE:?Set LIVESYNC_PASSPHRASE in .env}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-60}
    volumes:
      - quartz-vault:/data
    restart: unless-stopped

  quartz:
    build:
      context: ./quartz
    depends_on:
      - quartz-sync
    ports:
      - "8080:8080"
    volumes:
      - quartz-vault:/vault:ro
    restart: unless-stopped

volumes:
  couchdb-data:
  quartz-vault:
