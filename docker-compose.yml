services:
  couchdb:
    build:
      context: ./couchdb/docker-obsidian-livesync-couchdb
    ports:
      - "5984:5984"
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsu $$COUCHDB_USER:$$COUCHDB_PASSWORD http://localhost:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  couchdb-init:
    image: curlimages/curl:latest
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidian-wiki}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        URL="http://$$COUCHDB_USER:$$COUCHDB_PASSWORD@couchdb:5984"
        for db in _users _replicator _global_changes $$COUCHDB_DATABASE livesync-registry livesync-passphrases; do
          echo "Creating $$db..."
          curl -sf -X PUT "$$URL/$$db" || true
        done
        echo "Locking down registry + passphrases databases (admin only)..."
        for db in livesync-registry livesync-passphrases; do
          curl -sf -X PUT "$$URL/$$db/_security" \
            -H "Content-Type: application/json" \
            -d '{"admins":{"names":[],"roles":["_admin"]},"members":{"names":[],"roles":["_admin"]}}'
        done
        echo "Init complete."
    restart: "no"

  sync:
    build:
      context: ./sync
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_URI: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidian-wiki}
      LIVESYNC_PASSPHRASE: ${LIVESYNC_PASSPHRASE:?Set LIVESYNC_PASSPHRASE in .env}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-60}
    volumes:
      - vault:/data
    restart: unless-stopped

  sync-multi:
    build:
      context: ./sync
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      SYNC_MODE: multi
      COUCHDB_URI: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-60}
    volumes:
      - vaults:/data/vaults
    restart: unless-stopped

  agent:
    build:
      context: ./agent
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_URI: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidian-wiki}
      LIVESYNC_PASSPHRASE: ${LIVESYNC_PASSPHRASE:?Set LIVESYNC_PASSPHRASE in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env}
      INSTRUCTION: ${INSTRUCTION:-Describe the contents of this vault.}
    volumes:
      - agent-vault:/data
    restart: "no"

  agent-multi:
    build:
      context: ./agent
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_URI: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
      VAULT_NAME: ${VAULT_NAME:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env}
      INSTRUCTION: ${INSTRUCTION:-Describe the contents of this vault.}
    volumes:
      - agent-multi-vault:/data
    restart: "no"

  portal:
    build:
      context: ./portal
    depends_on:
      couchdb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      AUTH_MODE: ${AUTH_MODE:-local}
      USERS_FILE: /app/users.yaml
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-secret-key}
      COUCHDB_URI: http://couchdb:5984
      COUCHDB_EXTERNAL_URI: ${COUCHDB_EXTERNAL_URI:-http://localhost:5984}
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    volumes:
      - ./portal/users.yaml:/app/users.yaml:ro
      - vaults:/vaults:ro
      - static:/static
    restart: unless-stopped

volumes:
  couchdb-data:
  vault:
  vaults:
  static:
  agent-vault:
  agent-multi-vault:
